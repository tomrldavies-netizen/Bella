<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Bella – Edit medicine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3F6B4B}a:hover{color:#2F5239}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #FBF6EC; font-family: Nunito, sans-serif; color: #3B3127; display: flex; flex-direction: column; overflow: hidden">

<header style="flex-shrink: 0; background: #FBE3D3; border-radius: 0 0 28px 28px; padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 4px">
<a href="CarePlan.dc.html" style="align-self: flex-start; text-decoration: none; color: #3B3127; font-size: 14px; font-weight: 800; min-height: 40px; display: flex; align-items: center; gap: 4px"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Bella's plan</a>
<div style="display: flex; align-items: center; gap: 14px">
<svg viewBox="0 0 44 44" width="50" height="50" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#FFFFFF"></circle><circle cx="22" cy="22" r="14" fill="#E9A06B"></circle><circle cx="13" cy="13" r="4" fill="#F5D2A0"></circle><circle cx="31" cy="13" r="4" fill="#F5D2A0"></circle><circle cx="22" cy="23" r="9.5" fill="#F5D2A0"></circle><circle cx="18.5" cy="21" r="1.3" fill="#3B3127"></circle><circle cx="25.5" cy="21" r="1.3" fill="#3B3127"></circle><path d="M20.5 25 h3 l-1.5 1.8z" fill="#8A5A3B"></path></svg>
<div style="flex: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 28px; line-height: 1.1; font-weight: 800">Medicines</h1>
<div style="font-size: 13px; font-weight: 600; color: #4A4037">Change a dose, time, or add a new one</div>
</div>
</div>
</header>

<div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 0">

<div role="tablist" aria-label="Medicines" style="display: flex; gap: 6px">
<button type="button" role="tab" aria-selected="true" style="font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; color: #3B3127; background: #FBE3D3; border: 1.5px solid #E9A06B; border-radius: 999px; padding: 0 14px; height: 40px">Iron</button>
<button type="button" role="tab" aria-selected="false" style="font-family: Nunito, sans-serif; font-size: 13px; font-weight: 700; color: #4A4037; background: #FFFFFF; border: 1.5px solid #EFE4D2; border-radius: 999px; padding: 0 12px; height: 40px">Reflux</button>
<button type="button" role="tab" aria-selected="false" style="font-family: Nunito, sans-serif; font-size: 13px; font-weight: 700; color: #4A4037; background: #FFFFFF; border: 1.5px solid #EFE4D2; border-radius: 999px; padding: 0 12px; height: 40px">Vitamins</button>
<button type="button" style="margin-left: auto; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; color: #3F6B4B; background: transparent; border: 1.5px dashed #8DB596; border-radius: 999px; padding: 0 12px; height: 40px">+ New</button>
</div>

<div style="background: #FFFFFF; border: 1.5px solid #EFE4D2; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="med-name" style="font-size: 13px; font-weight: 800">Name</label>
<input id="med-name" type="text" value="Iron" style="font-family: Nunito, sans-serif; font-size: 15px; color: #3B3127; background: #F9F4EA; border: 1.5px solid #EFE4D2; border-radius: 12px; height: 44px; padding: 0 12px">
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 800">Dose</span><span style="font-size: 12px; color: #A2502F; font-weight: 700">was 1.0 ml until 19 Oct</span></div>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" aria-label="Less, 0.1 ml" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #F3EADC; font-size: 20px; font-weight: 800; color: #3B3127">−</button>
<span style="min-width: 70px; text-align: center; font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 800">1.2 ml</span>
<button type="button" aria-label="More, 0.1 ml" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #F3EADC; font-size: 20px; font-weight: 800; color: #3B3127">+</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 800">Given</span>
<div style="display: flex; gap: 6px; background: #F6EFE3; border-radius: 12px; padding: 4px">
<button type="button" aria-pressed="false" style="flex: 1; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 700; color: #4A4037; background: transparent; border: 0; border-radius: 9px; height: 36px">By mouth</button>
<button type="button" aria-pressed="false" style="flex: 1; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 700; color: #4A4037; background: transparent; border: 0; border-radius: 9px; height: 36px">Via tube</button>
<button type="button" aria-pressed="true" style="flex: 1; font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; color: #3B3127; background: #FFFFFF; border: 1.5px solid #E9A06B; border-radius: 9px; height: 36px">Either</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 800">Times each day</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="display: flex; align-items: center; gap: 2px; background: #FBE3D3; border-radius: 999px; padding: 0 2px 0 12px; height: 38px; font-size: 14px; font-weight: 800">05:00<button type="button" aria-label="Remove 05:00" style="width: 34px; height: 34px; border: 0; background: transparent; font-size: 16px; color: #3B3127">×</button></span>
<span style="display: flex; align-items: center; gap: 2px; background: #FBE3D3; border-radius: 999px; padding: 0 2px 0 12px; height: 38px; font-size: 14px; font-weight: 800">11:00<button type="button" aria-label="Remove 11:00" style="width: 34px; height: 34px; border: 0; background: transparent; font-size: 16px; color: #3B3127">×</button></span>
<span style="display: flex; align-items: center; gap: 2px; background: #FBE3D3; border-radius: 999px; padding: 0 2px 0 12px; height: 38px; font-size: 14px; font-weight: 800">17:00<button type="button" aria-label="Remove 17:00" style="width: 34px; height: 34px; border: 0; background: transparent; font-size: 16px; color: #3B3127">×</button></span>
<span style="display: flex; align-items: center; gap: 2px; background: #FBE3D3; border-radius: 999px; padding: 0 2px 0 12px; height: 38px; font-size: 14px; font-weight: 800">23:00<button type="button" aria-label="Remove 23:00" style="width: 34px; height: 34px; border: 0; background: transparent; font-size: 16px; color: #3B3127">×</button></span>
<button type="button" style="font-family: Nunito, sans-serif; font-size: 13px; font-weight: 800; color: #3F6B4B; background: transparent; border: 1.5px dashed #8DB596; border-radius: 999px; padding: 0 12px; height: 38px">+ Time</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="med-from" style="font-size: 13px; font-weight: 800">New dose from</label>
<input id="med-from" type="text" value="Today, 23:00" style="font-family: Nunito, sans-serif; font-size: 14px; color: #3B3127; background: #F9F4EA; border: 1.5px solid #EFE4D2; border-radius: 12px; height: 44px; padding: 0 10px; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="med-to" style="font-size: 13px; font-weight: 800">Ends</label>
<input id="med-to" type="text" value="No end date" style="font-family: Nunito, sans-serif; font-size: 14px; color: #3B3127; background: #F9F4EA; border: 1.5px solid #EFE4D2; border-radius: 12px; height: 44px; padding: 0 10px; min-width: 0">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="med-why" style="font-size: 13px; font-weight: 800">Why it changed</label>
<input id="med-why" type="text" value="New weight, agreed with nurse" style="font-family: Nunito, sans-serif; font-size: 14px; color: #3B3127; background: #F9F4EA; border: 1.5px solid #EFE4D2; border-radius: 12px; height: 44px; padding: 0 12px">
</div>
</div>
</div>

<div style="flex-shrink: 0; padding: 10px 16px 18px; background: #FFFFFF; border-top: 1.5px solid #EFE4D2; display: flex; flex-direction: column; gap: 8px">
<button type="button" aria-pressed="true" style="font-family: Nunito, sans-serif; font-size: 14px; font-weight: 700; color: #3B3127; background: transparent; border: 0; min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0"><span style="width: 40px; height: 24px; border-radius: 999px; background: #3F6B4B; display: flex; justify-content: flex-end; padding: 3px; box-sizing: border-box"><span style="width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span>Tell everyone about this change</button>
<button type="button" style="font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 800; color: #FFFFFF; background: #3F6B4B; border: 0; border-radius: 16px; height: 52px">Save medicine</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
